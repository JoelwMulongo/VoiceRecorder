name: CMake Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # CMake and Visual Studio's compiler are already installed on windows-latest

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare exe
      shell: pwsh
      run: Copy-Item build/Release/VoiceRecorderApp.exe VoiceRecorder.exe

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceRecorder-win64
        path: VoiceRecorder.exe

    # Runs only when you push a tag such as v1.0.0
    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: VoiceRecorder.exe
        generate_release_notes: true